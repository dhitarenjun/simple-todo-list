<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Simple To-Do List</h1>
        <p>Kelola tugas harianmu dengan mudah</p>

        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Masukkan tugas...">
            <button onclick="addTask()">Tambah</button>
        </div>

        <div class="filter">
            <button onclick="filterTasks('all')">Semua</button>
            <button onclick="filterTasks('active')">Belum Selesai</button>
            <button onclick="filterTasks('completed')">Selesai</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
